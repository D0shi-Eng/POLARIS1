# منافذ Phase-08 على ويندوز: كائن المهمّة ومُطلِقه، وصندوق AppContainer، ومتصفّح Edge بلا واجهة.
# حزمة منفصلة لأن مستعمليها اثنان: الربط (app) وعُدّة القياس الأصلية (harness)، ولأن `unsafe`
# فيها محصور في ملفات FFI مسمّاة يفحصها Phase-07.
[package]
name = "polaris-host-win"
description = "POLARIS Windows adapters: Job-Object launcher, AppContainer execution sandbox, headless Edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
polaris-host-core = { path = "../core" }

# مشغّل `agents-300-eval/2` على الصندوق الحقيقي (tests/agents300_eval2.rs): يضمّ أدوات اختبار النواة بمسارها ويقرأ مخزنها.
[dev-dependencies]
serde_json.workspace = true
rusqlite = { version = "0.42", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Isolation",
  "Win32_Security_Authorization",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_IO",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
