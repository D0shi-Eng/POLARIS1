# Phase-07: تصليب ثنائيات Windows.
#
# Control Flow Guard يجعل المُحمِّل يتحقق من كل استدعاء غير مباشر مقابل جدول أهداف
# صالحة يضعه الرابط، فقفزة إلى عنوان مزروع تُرفض. العلم مستقرّ على هدف MSVC منذ
# Rust 1.47، ولا يغيّر سلوك البرنامج الصحيح. ASLR وDEP (DYNAMIC_BASE وNX_COMPAT
# وHIGH_ENTROPY_VA) يضعها الرابط افتراضيًا، وأداة التصليب تقرأ الأعلام الأربعة من
# ترويسة PE لكل ثنائي بعد بنائه ولا تفترضها.
[target.x86_64-pc-windows-msvc]
rustflags = ["-Ccontrol-flow-guard"]
